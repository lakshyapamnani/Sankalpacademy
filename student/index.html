<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RC Tutorials - Student Workspace</title>
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --background: 222 47% 4%;
      --foreground: 210 40% 98%;
      --card: 222 47% 7%;
      --primary: 191.6 91.4% 36.5%; /* Premium Cyan */
      --primary-foreground: 210 20% 98%;
      --accent: 189 94% 43%;
      --muted: 217.2 32.6% 17.5%;
      --muted-foreground: 215 20.2% 65.1%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glowing Background Elements */
    .glow-bg {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, hsla(var(--primary), 0.15) 0%, transparent 70%);
      top: -10%;
      left: -10%;
      z-index: 0;
      pointer-events: none;
      filter: blur(40px);
      animation: float 15s ease-in-out infinite alternate;
    }

    .glow-bg-bottom {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, hsla(var(--accent), 0.1) 0%, transparent 70%);
      bottom: -15%;
      right: -15%;
      z-index: 0;
      pointer-events: none;
      filter: blur(50px);
      animation: float 20s ease-in-out infinite alternate-reverse;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(50px) scale(1.1); }
    }

    /* Card Layout */
    .container {
      width: 100%;
      max-width: 480px;
      padding: 24px;
      z-index: 1;
    }

    .card {
      background: rgba(10, 15, 30, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transform: translateY(0);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card:hover {
      border-color: hsla(var(--primary), 0.4);
      box-shadow: 0 30px 60px rgba(6, 182, 212, 0.15);
    }

    .logo-container {
      margin-bottom: 28px;
      position: relative;
      display: inline-block;
    }

    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover .logo {
      transform: scale(1.05) rotate(-5deg);
      border-color: hsla(var(--accent), 0.3);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #bae6fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: hsl(var(--muted-foreground));
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 36px;
      font-weight: 400;
    }

    /* Premium Action Button */
    .btn-portal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 32px;
      background: linear-gradient(135deg, hsl(var(--primary)) 0%, hsl(var(--accent)) 100%);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-portal::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.2),
        transparent
      );
      transition: all 0.6s ease;
    }

    .btn-portal:hover::before {
      left: 100%;
    }

    .btn-portal:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(6, 182, 212, 0.45);
    }

    .btn-portal:active {
      transform: translateY(0);
    }

    /* Decorative indicators */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.15);
      color: #22d3ee;
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #06b6d4;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <div class="glow-bg"></div>
  <div class="glow-bg-bottom"></div>

  <div class="container">
    <div class="card">
      <div class="badge">
        <div class="badge-dot"></div>
        Student Workspace
      </div>
      <br>
      <div class="logo-container">
        <img src="rctlogo.jpg" alt="RC Tutorials Logo" class="logo" onerror="this.src='https://rctutorials.vercel.app/icons/rctlogo.jpg'">
      </div>
      <h1>RC Tutorials</h1>
      <p>Log in to access your customized academic timeline, live video lectures, notes, test assessments, and AI learning tools.</p>
      
      <a href="https://rctutorials.vercel.app/rctstudent" class="btn-portal">
        Go to Student Login &rarr;
      </a>
    </div>
  </div>

</body>
</html>
