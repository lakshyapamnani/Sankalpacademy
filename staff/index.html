<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RC Tutorials - Staff Portal</title>
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --background: 224 71% 4%;
      --foreground: 213 31% 91%;
      --card: 224 71% 7%;
      --primary: 263.4 70% 50.4%;
      --primary-foreground: 210 20% 98%;
      --accent: 262.1 83.3% 57.8%;
      --muted: 223 47% 11%;
      --muted-foreground: 215.4 16.3% 56.9%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glowing Background Elements */
    .glow-bg {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, hsla(var(--primary), 0.15) 0%, transparent 70%);
      top: -10%;
      right: -10%;
      z-index: 0;
      pointer-events: none;
      filter: blur(40px);
      animation: float 15s ease-in-out infinite alternate;
    }

    .glow-bg-bottom {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, hsla(var(--accent), 0.1) 0%, transparent 70%);
      bottom: -15%;
      left: -15%;
      z-index: 0;
      pointer-events: none;
      filter: blur(50px);
      animation: float 20s ease-in-out infinite alternate-reverse;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-50px) scale(1.1); }
    }

    /* Card Layout */
    .container {
      width: 100%;
      max-width: 480px;
      padding: 24px;
      z-index: 1;
    }

    .card {
      background: rgba(13, 17, 30, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transform: translateY(0);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card:hover {
      border-color: hsla(var(--primary), 0.4);
      box-shadow: 0 30px 60px rgba(124, 58, 237, 0.15);
    }

    .logo-container {
      margin-bottom: 28px;
      position: relative;
      display: inline-block;
    }

    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover .logo {
      transform: scale(1.05) rotate(5deg);
      border-color: hsla(var(--accent), 0.3);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: hsl(var(--muted-foreground));
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 36px;
      font-weight: 400;
    }

    /* Premium Action Button */
    .btn-portal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 32px;
      background: linear-gradient(135deg, hsl(var(--primary)) 0%, hsl(var(--accent)) 100%);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-portal::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.2),
        transparent
      );
      transition: all 0.6s ease;
    }

    .btn-portal:hover::before {
      left: 100%;
    }

    .btn-portal:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(124, 58, 237, 0.45);
    }

    .btn-portal:active {
      transform: translateY(0);
    }

    /* Decorative indicators */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124, 58, 237, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.15);
      color: #c084fc;
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #a855f7;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* App Download Section */
    .app-download-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 12px;
    }

    .btn-download {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: hsl(var(--foreground));
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-download:active {
      transform: translateY(0);
    }

    .btn-download .icon {
      width: 20px;
      height: 20px;
      opacity: 0.8;
      transition: transform 0.3s ease;
    }

    .btn-download:hover .icon {
      opacity: 1;
      transform: scale(1.1);
    }

    .btn-android:hover {
      background: linear-gradient(135deg, rgba(61, 220, 132, 0.15) 0%, rgba(61, 220, 132, 0.05) 100%);
      border-color: rgba(61, 220, 132, 0.4);
      color: #3ddc84; /* Android green */
      box-shadow: 0 10px 25px rgba(61, 220, 132, 0.15);
      transform: translateY(-2px);
    }

    .btn-ios:hover {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15) 0%, rgba(56, 189, 248, 0.05) 100%);
      border-color: rgba(56, 189, 248, 0.4);
      color: #38bdf8; /* Cyan contrast for iOS */
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="glow-bg"></div>
  <div class="glow-bg-bottom"></div>

  <div class="container">
    <div class="card">
      <div class="badge">
        <div class="badge-dot"></div>
        Staff Administration
      </div>
      <br>
      <div class="logo-container">
        <img src="rctlogo.jpg" alt="RC Tutorials Logo" class="logo" onerror="this.src='https://rctutorials.vercel.app/icons/rctlogo.jpg'">
      </div>
      <h1>RC Tutorials</h1>
      <p>Secure administrative access to manage classes, register attendance, and evaluate performance analytics.</p>
      
      <div class="app-download-container">
        <a href="RCT Staff.apk" download="RCT Staff.apk" class="btn-download btn-android" title="Download Android App (APK)">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.5 13c-.8 0-1.5-.7-1.5-1.5S16.7 10 17.5 10s1.5.7 1.5 1.5-.7 1.5-1.5 1.5m-11 0c-.8 0-1.5-.7-1.5-1.5S5.7 10 6.5 10s1.5.7 1.5 1.5-.7 1.5-1.5 1.5m11.2-5.8l1.6-2.7c.1-.2 0-.5-.2-.6-.2-.1-.5 0-.6.2l-1.6 2.8C15.4 6.3 13.8 6 12 6s-3.4.3-4.9.9L5.5 4.1c-.1-.2-.4-.3-.6-.2-.2.1-.3.4-.2.6l1.6 2.7C3.6 8.9 1.7 11.7 1.5 15h21c-.2-3.3-2.1-6.1-4.8-7.8"/>
          </svg>
          <span>Android App</span>
        </a>
        <a href="https://rctutorials.vercel.app/rctstaff" class="btn-download btn-ios" title="Go to iOS / Web Portal">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.82M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.21.67-2.93 1.49-.62.69-1.16 1.84-1.01 2.96 1.12.09 2.27-.57 2.95-1.39z"/>
          </svg>
          <span>iOS / Web</span>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
